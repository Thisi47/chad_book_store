name: chad_book_store
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management & DI
  flutter_riverpod: ^2.6.1 # Ou version compatible 2026
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.0.0

  # Utilitaires & UI
  flutter_hooks: ^0.20.0
  cached_network_image: ^3.4.1
  
  # Données Locales (Offline-first)
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.12.0
  hooks_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  image_picker: ^1.2.4
  syncfusion_flutter_pdfviewer: ^35.2.12
  flutter_epub_viewer: ^2.2.1
  http: ^1.6.0
  flutter_markdown: ^0.7.7
  # Nous ajouterons Drift/Isar plus tard pour ne pas surcharger maintenant

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.0 # Pour nous forcer à coder proprement
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
