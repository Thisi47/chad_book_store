name: chad_book_store
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # State Management & DI
  flutter_riverpod: ^2.6.1 # Ou version compatible 2026
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.0.0

  # Utilitaires & UI
  flutter_hooks: ^0.20.0
  google_fonts: ^6.2.0 # Pour une typo pro
  
  # Données Locales (Offline-first)
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.12.0
  hooks_riverpod: ^2.6.1
  # Nous ajouterons Drift/Isar plus tard pour ne pas surcharger maintenant

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.0 # Pour nous forcer à coder proprement

flutter:
  uses-material-design: true
